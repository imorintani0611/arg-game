<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS-7 刑案管理系統 | 帳號重設</title>
<link rel="stylesheet" href="css/style.css?v=8">
<link rel="stylesheet" href="css/login.css?v=8">
</head>
<body class="login-body">

<div class="login-card">
  <p class="login-system">CMS-7</p>
  <h1 class="login-title">帳號密碼重設</h1>
  <p class="login-sub">請輸入警員編號並回答安全問題</p>

  <label class="login-label" for="resetCode">警員編號</label>
  <input type="text" id="resetCode" class="login-input" autocomplete="off" placeholder="輸入警員編號">

  <p class="login-label" style="margin-top:4px;">請選擇安全問題</p>
  <div class="question-options">
    <button type="button" class="question-btn" data-q="birthday">我的生日</button>
    <button type="button" class="question-btn" data-q="class">我小學的班級</button>
    <button type="button" class="question-btn" data-q="happiest">我最開心的一天</button>
  </div>

  <div id="answerBlock" style="display:none;">
    <label class="login-label" for="resetAnswer" id="resetAnswerLabel">答案</label>
    <input type="text" id="resetAnswer" class="login-input" autocomplete="off" placeholder="輸入答案">
    <button id="resetBtn" class="login-btn">驗證</button>
  </div>

  <div id="resetResult"></div>

  <a href="login.html" class="login-forgot">返回登入頁</a>
</div>

<script src="js/account-reset.js?v=8"></script>
</body>
</html>
