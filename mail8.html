<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刑案管理系統 CMS-7 | 郵件</title>
<link rel="stylesheet" href="css/style.css?v=27">
</head>
<body data-mail-id="mail8">

<div class="scanline"></div>

<header class="sys-header">
  <a href="index.html" class="sys-header-left">
    <span class="sys-badge">CMS-7</span>
    <span class="sys-title">內部信箱</span>
  </a>
  <nav class="sys-nav">
    <a href="personnel.html" class="nav-icon" aria-label="人員查詢">🪪</a>
    <a href="evidence.html" class="nav-icon" aria-label="證據系統">📁</a>
    <a href="inbox.html" class="nav-icon mail-entry active" aria-label="信箱">
      <span class="mail-icon">✉</span>
      <span class="mail-badge">1</span>
    </a>
  </nav>
</header>

<main class="doc-page">

  <div class="mail-detail-meta">
    <span class="mail-detail-from">（來源不明）</span>
    <span class="mail-detail-time">剛剛</span>
  </div>

  <h1 class="doc-title mail-detail-subject">（無主旨）</h1>

  <div class="letter">
    <p>我只是覺得所有人都值得知道真相。</p>
  </div>

  <div class="reply-template" style="margin-top:16px;">
    <span>你是</span>
    <input type="text" id="caNameInputMail8" class="reply-input" autocomplete="off">
    <span>吧？</span>
  </div>
  <button id="caNameBtnMail8" class="btn-primary" style="width:100%">送出</button>
  <p id="caNameResultMail8" class="reply-status"></p>

  <section class="action-block">
    <a href="inbox.html" class="btn-secondary">返回信箱</a>
  </section>

</main>

<footer class="sys-footer">
  <span>本系統僅供內部使用 · 存取紀錄將被留存</span>
</footer>

<script src="js/ca-reply.js?v=27"></script>
<script src="js/site.js?v=27"></script>
</body>
</html>
