<body class="se-body">

<header class="notice-header">
  <span class="notice-org">地方新聞網 · 社會版</span>
</header>

<main class="se-main">

  <article class="news-article">
    <p class="news-date">最近</p>
    <h1 class="news-headline">分局長獨生女失蹤 警方籲請民眾協尋</h1>
    <p class="news-subhead">
      臺北市中山分局分局長劉育豪之女，於住家附近失蹤，
      警方已擴大搜索，呼籲知情民眾提供線索。
    </p>

    <p>
      本報訊，臺北市政府警察局中山分局分局長劉育豪之獨生女，
      日前放學後即失去聯繫，家屬多方尋找未果，於當晚報案協尋。
    </p>
    <p>
      據了解，女童最後出現地點為住家附近巷口，監視器畫面模糊，
      警方初步排除自行離家可能，已擴大搜索範圍，
      並呼籲社會大眾提供相關線索。
    </p>
    <p>
      劉育豪對此事情緒激動，多次婉拒本報進一步採訪。
    </p>
  </article>

  <div style="text-align:center; margin-top:32px; padding-top:20px; border-top:1px solid #ddd;">
    <button id="closeComputerBtn" style="background:#2a2a2a; color:#eee; border:none; padding:12px 32px; font-size:14px; cursor:pointer; border-radius:4px;">關閉</button>
  </div>

</main>

<script>
  document.getElementById("closeComputerBtn").addEventListener("click", () => {
    const outcome = localStorage.getItem("liu_reply_outcome");
    if (outcome === "1A") {
      window.location.href = "ending-transferred.html";
    } else if (outcome === "1B") {
      window.location.href = "ending.html";
    } else {
      window.location.href = "ending-withdraw.html";
    }
  });
</script>
