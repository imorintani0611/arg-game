    <h1 class="news-headline">分局長獨生女不幸墜樓 警方初步排除他殺</h1>
    <p class="news-subhead">
      臺北市中山分局分局長劉育豪之女，日前於住家陽台不慎墜樓，
      送醫後宣告不治，警方初步排除他殺可能。
    </p>

    <p>
      本報訊，臺北市政府警察局中山分局分局長劉育豪之獨生女，
      近日於自家陽台發生墜樓意外，經送醫搶救後仍宣告不治，得年9歲。
    </p>
    <p>
      據了解，案發時劉員正在值勤，家中僅有女童一人，
      警方初步研判為單純意外，將持續調查具體原因。
    </p>
    <p>
      劉育豪對此事婉拒本報進一步採訪。
    </p>
