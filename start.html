<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS-7</title>
<style>
  body {
    margin: 0;
    background: #0B0B0A;
    color: #D8D4C8;
    font-family: "Noto Serif TC", "Noto Sans TC", serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .start-wrap {
    max-width: 480px;
    width: 100%;
  }
  .start-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 8px;
    color: #7C8492;
    margin-bottom: 40px;
  }
  .start-text p {
    font-size: 15px;
    line-height: 2;
    margin: 0 0 18px;
    letter-spacing: 0.5px;
  }
  .start-btn-wrap {
    text-align: center;
    margin: 40px 0 48px;
  }
  .start-btn {
    background: #B3261E;
    color: #fff;
    border: none;
    padding: 14px 40px;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: 4px;
    cursor: pointer;
    border-radius: 2px;
  }
  .start-btn:hover {
    background: #952019;
  }
  .start-notes {
    border-top: 1px solid #2A2F38;
    padding-top: 24px;
  }
  .start-notes-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: #7C8492;
    margin-bottom: 14px;
  }
  .start-notes ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .start-notes li {
    font-size: 12.5px;
    line-height: 1.9;
    color: #9098A3;
    margin-bottom: 10px;
    padding-left: 18px;
    position: relative;
  }
  .start-notes li::before {
    content: "○";
    position: absolute;
    left: 0;
    font-size: 10px;
    top: 4px;
  }
</style>
</head>
<body>

<div class="start-wrap">

  <p class="start-title">C M S - 7</p>

  <div class="start-text">
    <p>你是臺北市政府警察局中山分局的菜鳥警員，警員編號9021。</p>

    <p>到職還不滿一年，大多時候負責一些不起眼的行政庶務——謄寫報告、歸檔案卷、處理民眾陳情，偶爾支援值班。</p>

    <p>今天，你一如往常打開了值班用的電腦，準備開始今天的工作。</p>

    <p>你不知道，這將會是你在警局裡，最後一段還能假裝什麼都不知道的日子。</p>
  </div>

  <div class="start-btn-wrap">
    <button class="start-btn" onclick="window.location.href='index.html'">開啟電腦</button>
  </div>

  <div class="start-notes">
    <p class="start-notes-title">關於這個遊戲</p>
    <ul>
      <li>所有線索都藏在頁面之中，不需要查看網頁原始碼。</li>
      <li>遊戲進度會自動保存在你目前使用的瀏覽器裡；更換裝置或清除瀏覽器資料會導致進度遺失。</li>
      <li>建議使用手機直向瀏覽，體驗最佳。</li>
      <li>本遊戲涉及部分較沉重的社會議題，如有不適請自行斟酌是否繼續。</li>
    </ul>
  </div>

</div>

</body>
</html>
