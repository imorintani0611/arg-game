  <h1 class="doc-title mail-detail-subject">（無主旨）</h1>

  <div class="letter">
    <p>謝謝你。</p>
    <p>老實說，我當年不懂美玉姐為什麼要那樣做。</p>
    <p>我以為她是要整我，這幾年我都是這樣想的。</p>
    <p>後來我才慢慢明白，她可能只是不希望再有人被拖進來。</p>
    <p>這件事比你我想像的都要大得多，牽涉的不是一兩個人的錯。</p>
    <p>如果她真的因此離開了這個漩渦，我反而覺得，這樣也好。</p>
    <p>你也是。到此為止吧，好嗎？</p>
  </div>

  <section class="action-block">
    <a href="inbox.html" class="btn-secondary">返回信箱</a>
