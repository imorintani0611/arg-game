    justify-content: center;

    max-width: 480px;
    animation: fadeIn 2.5s ease-in;

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }

  .ending-text p {
    font-size: 15.5px;
    line-height: 2.1;

<body>

<div class="ending-wrap">

  <p class="ending-title">END</p>

  <div class="ending-text">
    <p>你看著這則新聞，久久無法把視線從螢幕上移開。</p>

    <p>你想起自己當初收到那封回信時的猶豫——「我會退出的」，是你自己送出去的那句話。</p>

    <p>你不知道這兩件事之間是否真的有關聯，也不知道自己是不是在為一件與己無關的事過度自責。</p>

    <p>但那種說不清楚的沉重感，還是死死地纏住了你。</p>

    <p>你想起劉育豪信裡寫的那些話，想起自己選擇不再追問下去的那一刻。</p>

    <p>也許什麼都不會改變，也許查下去也不會有不同的結果。</p>

    <p>但你還是沒辦法說服自己，這一切真的與你無關。</p>

    <p>幾天後，你遞出了辭呈。</p>

    <p>沒有人知道原因，你自己也說不清楚。</p>

    <p>你只是覺得，自己沒辦法再繼續坐在這張辦公桌前了。</p>
  </div>

  <p class="ending-final">— 全 劇 終 —</p>

  </div>

</div>

</body>
