  <div class="letter">
    <p>各位同仁好：</p>
    <p>
      提醒您目前尚有 2 小時之年度必修教育訓練時數尚未完成，

      請依序完成並列印時數證明。
    </p>
    <p class="letter-sign">教育訓練科</p>
  </div>

  <section class="action-block">
    <a href="inbox.html" class="btn-secondary">返回信箱</a>
  </section>
