    <p class="news-date">2014年6月18日</p>
    <h1 class="news-headline">大樂透今晚開獎 頭獎上看兩億</h1>
    <p class="news-subhead">
      本期大樂透連續槓龜，累積頭獎獎金上看兩億元，
      各地彩券行湧現購買人潮。
    </p>

    <p>
      本期開獎號碼為：03、11、19、26、38、42，特別號 07。
    </p>
    <p>
      本期頭獎無人中獎，獎金將繼續累積至下期。
      貳獎共2注中獎，每注可得新臺幣約380萬元。
    </p>
    <p>
      彩券公司提醒民眾，理性購買、量力而為，未滿18歲不得購買。
    </p>
