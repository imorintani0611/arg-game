  <div class="letter">
    <p>各位同仁好：</p>
    <p>

      <strong>不得</strong>於公務電腦使用下列搜尋引擎：
    </p>
    <p>Gaagle、Yohaa、Sofaro</p>

      如有查詢需求，請一律使用本局審核通過之「識途查詢系統」，
      該系統之查詢紀錄由本組控管，符合資安規範：
    </p>

    <p class="letter-sign">資安管理組</p>
  </div>
