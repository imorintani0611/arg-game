<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刑案管理系統 CMS-7 | 人員查詢</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<div class="scanline"></div>

<header class="sys-header">
  <a href="index.html" class="sys-header-left">
    <span class="sys-badge">CMS-7</span>
    <span class="sys-title">人員查詢系統</span>
  </a>
  <nav class="sys-nav">
    <a href="personnel.html" class="nav-icon active" aria-label="人員查詢">🪪</a>
    <a href="evidence.html" class="nav-icon" aria-label="證據系統">📁</a>
    <a href="inbox.html" class="nav-icon mail-entry" aria-label="信箱">
      <span class="mail-icon">✉</span>
      <span class="mail-badge">6</span>
    </a>
  </nav>
</header>

<main class="doc-page">

  <div class="doc-meta">
    <span>系統歸檔 A-11092</span>
    <span>存取層級 一般</span>
  </div>

  <h1 class="doc-title">警用人員查詢系統</h1>
  <p class="doc-sub">輸入姓名與警員編號以查詢人事資料</p>

  <label class="field-label" for="personnelName">姓名</label>
  <input type="text" id="personnelName" class="passcode-input" autocomplete="off" placeholder="輸入姓名">

  <label class="field-label" for="personnelCode">警員編號</label>
  <input type="text" id="personnelCode" class="passcode-input" autocomplete="off" placeholder="輸入警員編號">

  <button id="personnelBtn" class="btn-primary" style="width:100%">查詢</button>

  <div id="personnelResult"></div>

</main>

<footer class="sys-footer">
  <span>本系統僅供內部使用 · 存取紀錄將被留存</span>
</footer>

<script src="js/personnel.js?v=3"></script>
<script src="js/site.js?v=3"></script>
</body>
</html>
