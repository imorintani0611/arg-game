<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刑案管理系統 CMS-7</title>
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

<div class="scanline"></div>

<header class="sys-header">
  <a href="index.html" class="sys-header-left">
    <span class="sys-badge">CMS-7</span>
    <span class="sys-title">警員系統</span>
  </a>
  <nav class="sys-nav">
    <a href="personnel.html" class="nav-icon" aria-label="人員查詢">🪪</a>
    <a href="evidence.html" class="nav-icon" aria-label="證據系統">📁</a>
    <a href="inbox.html" class="nav-icon mail-entry" aria-label="信箱">
      <span class="mail-icon">✉</span>
      <span class="mail-badge">7</span>
    </a>
  </nav>
</header>

<main class="doc-page">

  <div class="dash-welcome">
    <p class="dash-greeting">已登入：警員 · 編號 <span class="logged-in-id">9021</span></p>
    <h1 class="doc-title">待處理案件</h1>
  </div>

  <section class="pending-cases">
    <div class="case-group">
      <div class="case-group-title">交通事故（2）</div>
      <ul class="case-code-list">
        <li>TA23052024</li>
        <li>TA11062024</li>
      </ul>
    </div>

    <div class="case-group">
      <div class="case-group-title">重大刑案（1）</div>
      <ul class="case-code-list">
        <li>CR30042024</li>
      </ul>
    </div>

    <div class="case-group">
      <div class="case-group-title">可疑死亡（1）</div>
      <ul class="case-code-list">
        <li>SA02032024</li>
      </ul>
    </div>

    <div class="case-group">
      <div class="case-group-title">失蹤人口（1）</div>
      <ul class="case-code-list">
        <li>MP19012024</li>
      </ul>
    </div>

    <div class="case-group">
      <div class="case-group-title">死亡登記（1）</div>
      <ul class="case-code-list">
        <li>DR02092024</li>
      </ul>
    </div>
  </section>

  <section class="action-block">
    <button id="logoutBtn" class="btn-danger" style="width:100%; box-sizing:border-box;">登出系統</button>
    <p id="logoutMsg" class="logout-msg"></p>
  </section>


</main>

<footer class="sys-footer">
  <span>本系統僅供內部使用 · 存取紀錄將被留存</span>
</footer>

<script src="js/logout.js?v=8"></script>
<script src="js/site.js?v=8"></script>
</body>
</html>
