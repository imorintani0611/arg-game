<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刑案管理系統 CMS-7 | 郵件</title>
<link rel="stylesheet" href="css/style.css?v=26">
</head>
<body data-mail-id="mail7">

<div class="scanline"></div>

<header class="sys-header">
  <a href="index.html" class="sys-header-left">
    <span class="sys-badge">CMS-7</span>
    <span class="sys-title">內部信箱</span>
  </a>
  <nav class="sys-nav">
    <a href="personnel.html" class="nav-icon" aria-label="人員查詢">🪪</a>
    <a href="evidence.html" class="nav-icon" aria-label="證據系統">📁</a>
    <a href="inbox.html" class="nav-icon mail-entry active" aria-label="信箱">
      <span class="mail-icon">✉</span>
      <span class="mail-badge">7</span>
    </a>
  </nav>
</header>

<main class="doc-page">

  <div class="mail-detail-meta">
    <span class="mail-detail-from">（來源不明）</span>
    <span class="mail-detail-time">剛剛</span>
  </div>

  <h1 class="doc-title mail-detail-subject">如果你還想繼續查</h1>

  <div class="letter">
    <p>你猜的沒錯，我不是林秉澤。</p>
    <p>
      但既然你已經查到這一步，就不該停在這裡。
    </p>
    <p>
      這個系統的帳號重設機制很鬆，很多老員警的資安觀念很差，
      這種漏洞放了很多年沒人補——只要答對安全問題，
      就能重設密碼、拿到他當時的權限。
    </p>
    <p>
      剩下的，你自己想辦法。
    </p>
  </div>

  <section class="action-block">
    <a href="inbox.html" class="btn-secondary">返回信箱</a>
  </section>

  <section class="ca-reply-block" id="caReplyBlock" style="display:none">
    <h2 class="reply-heading">回覆</h2>
    <div class="question-options">
      <button type="button" class="question-btn" id="askWhoBtn">你是誰</button>
      <button type="button" class="question-btn" id="askPurposeBtn">你的目的是什麼</button>
    </div>

    <div id="whoGuessBlock" style="display:none; margin-top:16px;">
      <div class="reply-template">
        <span>你是</span>
        <input type="text" id="caNameInput" class="reply-input" autocomplete="off">
        <span>吧？</span>
      </div>
      <button id="caNameBtn" class="btn-primary" style="width:100%">送出</button>
      <p id="caNameResult" class="reply-status"></p>
    </div>
  </section>

</main>

<footer class="sys-footer">
  <span>本系統僅供內部使用 · 存取紀錄將被留存</span>
</footer>

<script src="js/ca-reply.js?v=26"></script>
<script src="js/site.js?v=26"></script>
</body>
</html>
