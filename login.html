<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS-7 刑案管理系統 | 登入</title>
<link rel="stylesheet" href="css/style.css?v=25">
<link rel="stylesheet" href="css/login.css?v=25">
</head>
<body class="login-body">

<div class="login-card">
  <p class="login-system">CMS-7</p>
  <h1 class="login-title">刑案管理系統</h1>
  <p class="login-sub">請輸入帳號密碼登入</p>

  <label class="login-label" for="loginAccount">帳號</label>
  <input type="text" id="loginAccount" class="login-input" autocomplete="off" placeholder="警員編號">

  <label class="login-label" for="loginPassword">密碼</label>
  <input type="password" id="loginPassword" class="login-input" autocomplete="off" placeholder="密碼">

  <button id="loginBtn" class="login-btn">登入</button>
  <p id="loginMsg" class="login-msg"></p>

  <div class="remembered-block">
    <p class="remembered-label">已儲存的帳號</p>
    <button id="rememberedBtn9021" class="remembered-btn">
      <span class="remembered-id">9021</span>
      <span class="remembered-tag">點一下自動登入</span>
    </button>
    <button id="rememberedBtn7734" class="remembered-btn" style="display:none; margin-top:8px;">
      <span class="remembered-id">7734</span>
      <span class="remembered-tag">點一下自動登入</span>
    </button>
  </div>

  <a href="#" id="forgotLink" class="login-forgot">忘記密碼？</a>
</div>

<script src="js/login.js?v=25"></script>
</body>
</html>
