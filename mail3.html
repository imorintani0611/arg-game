<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刑案管理系統 CMS-7 | 郵件</title>
<link rel="stylesheet" href="css/style.css?v=14">
</head>
<body data-mail-id="mail3">

<div class="scanline"></div>

<header class="sys-header">
  <a href="index.html" class="sys-header-left">
    <span class="sys-badge">CMS-7</span>
    <span class="sys-title">內部信箱</span>
  </a>
  <nav class="sys-nav">
    <a href="personnel.html" class="nav-icon" aria-label="人員查詢">🪪</a>
    <a href="evidence.html" class="nav-icon" aria-label="證據系統">📁</a>
    <a href="inbox.html" class="nav-icon mail-entry active" aria-label="信箱">
      <span class="mail-icon">✉</span>
      <span class="mail-badge">7</span>
    </a>
  </nav>
</header>

<main class="doc-page">

  <div class="mail-detail-meta">
    <span class="mail-detail-from">資訊室 系統通知</span>
    <span class="mail-detail-time">3天前</span>
  </div>

  <h1 class="doc-title mail-detail-subject">您的系統密碼即將到期</h1>

  <div class="letter">
    <p>親愛的使用者您好：</p>
    <p>
      您的 CMS-7 系統登入密碼將於 7 天後到期，請於期限前至個人設定頁面完成變更。
      逾期未變更者，帳號將暫時停用，需洽資訊室協助復原。
    </p>
    <p>
      密碼設定原則：至少 8 碼，需包含英文字母與數字，不得與前 3 次使用之密碼相同。
    </p>
    <p class="letter-sign">資訊室（分機 1999）</p>
  </div>

  <section class="action-block">
    <a href="inbox.html" class="btn-secondary">返回信箱</a>
  </section>

</main>

<footer class="sys-footer">
  <span>本系統僅供內部使用 · 存取紀錄將被留存</span>
</footer>

<script src="js/site.js?v=14"></script>
</body>
</html>
